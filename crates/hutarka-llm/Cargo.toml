[package]
name = "hutarka-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
